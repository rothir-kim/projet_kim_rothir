databases:
  - name: pollution-db
    databaseName: pollution_db
    plan: free
    region: oregon

services:
  - type: web
    name: projet-kim-rothir-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: pollution-db
          property: connectionString
      - key: ORIGINES_AUTORISEES
        sync: false
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP01 - Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <form id="signup-form" novalidate>
            <h2>Inscription</h2>

            <div id="error-message" class="error hidden" role="alert" aria-live="polite"></div>

            <div class="form-group">
                <label for="login">Login :</label>
                <input type="text" id="login" name="login" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmation du mot de passe :</label>
                <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" autocomplete="family-name" required>
            </div>

            <div class="form-group">
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" name="prenom" autocomplete="given-name" required>
            </div>

            <div class="form-group">
                <label for="adresse">Adresse :</label>
                <input type="text" id="adresse" name="adresse" autocomplete="street-address" required>
            </div>

            <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone :</label>
                <input type="tel" id="telephone" name="telephone" autocomplete="tel" required>
            </div>

            <div class="form-group">
                <label for="naissance">Date de naissance :</label>
                <input type="date" id="naissance" name="naissance" autocomplete="bday" required>
            </div>

            <button type="submit">S'inscrire</button>
        </form>

        <div id="summary-page" class="hidden">
            <h2>Récapitulatif de votre inscription</h2>
            <div id="summary-content"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>

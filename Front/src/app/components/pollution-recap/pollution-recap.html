<div class="recap-container">
  <h2>Récapitulatif de la déclaration</h2>

  <div class="recap-header">
    <span class="badge">{{ data().type }}</span>
    <h3>{{ data().titre }}</h3>
  </div>

  <div class="recap-body">
    <div class="info-group">
      <label>Description :</label>
      <p>{{ data().description }}</p>
    </div>

    <div class="info-grid">
      <div class="info-group">
        <label>Date de l'observation :</label>
        <p>{{ data().date | date:'dd/MM/yyyy' }}</p>
      </div>

      <div class="info-group">
        <label>Lieu :</label>
        <p>{{ data().lieu }}</p>
      </div>

      <div class="info-group">
        <label>Coordonnées GPS :</label>
        <p>{{ data().latitude }}, {{ data().longitude }}</p>
      </div>
    </div>

    @if (data().photoUrl) {
      <div class="info-group photo-section">
        <label>Photo transmise :</label>
        <div class="image-wrapper">
          <img [src]="data().photoUrl" [alt]="data().titre" />
        </div>
      </div>
    }
  </div>

  <button type="button" class="btn-new" (click)="onNewDeclaration()">
    Déclarer une autre pollution
  </button>
</div>
